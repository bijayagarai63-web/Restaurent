<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form>
        <h1>Book a Table</h1>
        <div>
            <label>Name:</label>
            
            <input type="text"  placeholder="Name">
        </div>

        <div>
            <label>Date:</label>
            <input type="date" placeholer="choose a date">
        </div>

        <div>
            <label>Time:</label>
            <input type="time" placeholder="Time">
        </div>

        <div class="pref">
            <label>Preference:</label>
            <textarea rows="9" cols="30" placeholder="Preference for table booking"></textarea>
        </div>

        <div>
            <button>Book now</button>
        </div>
    </form>
    </body>

</html>
